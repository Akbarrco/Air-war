<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berani Sampai Akhir?</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #050b14;
  color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.container {
  max-width: 420px;
  width: 100%;
  padding: 20px;
}

h1 {
  margin-bottom: 16px;
}

p {
  opacity: 0.7;
  margin-bottom: 30px;
}

button {
  padding: 14px 24px;
  background: #0a3cff;
  border: none;
  border-radius: 999px;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.hidden {
  display: none;
}

#box {
  width: 120px;
  height: 120px;
  background: red;
  margin: 20px auto;
  cursor: pointer;
}

.progress {
  width: 100%;
  height: 12px;
  background: #222;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 20px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: lime;
  transition: width 0.3s;
}

.shake {
  animation: shake 0.3s;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(5px); }
  75% { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}
</style>
</head>

<body>

<div class="container">

  <!-- INTRO -->
  <div id="intro">
    <h1>⚠️ Berani Sampai Akhir?</h1>
    <p>Website ini tidak ramah untuk yang gampang nyerah.</p>
    <button onclick="startGame()">Mulai Tantangan</button>
  </div>

  <!-- LEVEL 1 -->
  <div id="level1" class="hidden">
    <h1>LEVEL 1</h1>
    <p>Klik kotak merah sebelum ilang.</p>
    <div id="box" onclick="level1Success()"></div>
  </div>

  <!-- LEVEL 2 -->
  <div id="level2" class="hidden">
    <h1>LEVEL 2</h1>
    <p>Jangan klik apa-apa.</p>
    <div class="progress">
      <div class="progress-bar" id="bar"></div>
    </div>
  </div>

  <!-- LEVEL 3 -->
  <div id="level3" class="hidden">
    <h1>LEVEL 3</h1>
    <p>Lu beneran gabut?</p>
    <button onclick="fail()">Iseng</button>
    <button onclick="fail()">Gabut</button>
  </div>

  <!-- END -->
  <div id="end" class="hidden">
    <h1>🏁 SELESAI</h1>
    <p>Lu terlalu gabut buat nyerah.</p>
    <button onclick="location.reload()">Main Lagi</button>
  </div>

</div>

<script>
function startGame() {
  hideAll();
  document.getElementById("level1").classList.remove("hidden");

  setTimeout(() => {
    document.getElementById("box").style.display = "none";
    fail();
  }, 3000);
}

function level1Success() {
  hideAll();
  document.getElementById("level2").classList.remove("hidden");
  startProgress();
}

function startProgress() {
  let bar = document.getElementById("bar");
  let width = 0;

  let interval = setInterval(() => {
    width++;
    bar.style.width = width + "%";
    if (width >= 100) {
      clearInterval(interval);
      hideAll();
      document.getElementById("level3").classList.remove("hidden");
    }
  }, 80);

  document.body.onclick = () => {
    clearInterval(interval);
    fail();
  };
}

function fail() {
  document.body.classList.add("shake");
  setTimeout(() => {
    document.body.classList.remove("shake");
    location.reload();
  }, 500);
}

function hideAll() {
  document.querySelectorAll(".container > div").forEach(el => {
    el.classList.add("hidden");
  });
  document.body.onclick = null;
}
</script>

</body>
</html>
